<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ipowork Pro — Merchant Banker · Institution · CA/CS</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="ipw-gate.js" data-roles="merchant_banker,institution,fund_manager,ca_cs" data-title="ipowork Pro"></script>
<script src="issuer-engine.js"></script>
<script src="pro-core.js"></script>
<style>
:root{--page:#F3F1EC;--paper:#FAFAF8;--card:#FFFFFF;--line:#E2E8EA;--soft:#F1F5F6;--ink:#1A2E35;--ink2:#2C3E47;--muted:#6B7E85;
  --brand:#0D5C6B;--brand2:#1A7D90;--figure:#08404D;--tint:#EEF6F7;--cta:#E88A2E;--gold:#C9932A;
  --up:#1A9E6B;--up-bg:#EAF7F1;--up-line:#C4E8D6;--down:#C0392B;--down-bg:#FDF0EE;--down-line:#F2CBC4;--mix:#B8650A;--mix-bg:#FEF6E8;--mix-line:#F2DDB4;--opp:#2F6FD1;--opp-bg:#EDF3FC;
  --serif:'Fraunces',Georgia,serif;--sans:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --sh:0 1px 4px rgba(13,92,107,.06),0 4px 16px rgba(13,92,107,.04);--px:28px;color-scheme:light}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;font-size:14px}
a{color:var(--brand)}
.shell{max-width:1320px;margin:0 auto;background:var(--paper);min-height:100vh}
.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);box-shadow:var(--sh);padding:10px var(--px);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--serif);font-weight:900;font-size:20px;color:var(--figure);text-decoration:none}.logo span{color:var(--cta)}
.desk{font-size:12px;font-weight:800;letter-spacing:.8px;color:var(--muted);padding-left:10px;border-left:1px solid var(--line)}
.top .sp{flex:1}
.top select,.top input{font:inherit;font-size:13px;min-height:36px;padding:0 10px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:0 14px;border-radius:9px;font:inherit;font-weight:700;font-size:13px;text-decoration:none;border:0;cursor:pointer;white-space:nowrap}
.btn.p{background:var(--cta);color:#fff}.btn.s{background:var(--brand);color:#fff}.btn.o{background:#fff;border:1.5px solid var(--line);color:var(--ink)}.btn.sm{min-height:30px;padding:0 10px;font-size:12px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--cta);outline-offset:2px}
.tabs{position:sticky;top:var(--hdr,57px);z-index:25;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px var(--px);background:rgba(250,250,248,.95);border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;min-height:36px;padding:0 13px;border-radius:18px;border:1px solid var(--line);background:#fff;font:inherit;font-size:12.5px;font-weight:700;color:var(--ink2);cursor:pointer}
.tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
main{padding:20px var(--px) 90px}
h1{font-family:var(--serif);font-size:24px;margin:0 0 4px;color:var(--figure)}h2{font-family:var(--serif);font-size:19px;margin:22px 0 10px;color:var(--figure)}
.sub{color:var(--muted);font-size:13px;line-height:1.5;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--sh)}
.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.kpi{cursor:pointer;border-top:3px solid var(--brand2);text-align:left;font:inherit;color:inherit}
.kpi.red{border-top-color:var(--down)}.kpi.amb{border-top-color:var(--mix)}.kpi.grn{border-top-color:var(--up)}.kpi.blu{border-top-color:var(--opp)}
.kpi .n{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--figure)}.kpi .l{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.4px}
.kpi.on{outline:2px solid var(--brand);outline-offset:1px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--muted);background:var(--tint);padding:10px;white-space:nowrap;cursor:pointer;user-select:none}
th.n,td.n{text-align:right}td{padding:10px;border-top:1px solid var(--soft);vertical-align:top}td.n{font-family:var(--mono);white-space:nowrap}
tr.row{cursor:pointer}tr.row:hover td{background:#FBFDFD}
.cn b{display:block;font-size:13.5px;color:var(--figure)}.cn small{color:var(--muted);font-size:11.5px}
.dot{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:12px;white-space:nowrap}
.dot::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.dot.g{background:var(--up-bg);color:var(--up)}.dot.a{background:var(--mix-bg);color:var(--mix)}.dot.r{background:var(--down-bg);color:var(--down)}.dot.b{background:var(--opp-bg);color:var(--opp)}
.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{font-size:11px;font-weight:700;padding:3px 8px;border-radius:10px;background:var(--tint);color:var(--figure);white-space:nowrap}
.chip.strong{background:var(--up-bg);color:var(--up)}.card .chip,.rt .chip{white-space:normal}.rt>.chip{align-self:start}.chip.attention{background:var(--down-bg);color:var(--down)}
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.filters label{font-size:11px;font-weight:700;color:var(--muted);display:block}
.filters input,.filters select,.form input,.form select,.form textarea{width:100%;font:inherit;font-size:13px;min-height:38px;padding:6px 10px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);margin-top:3px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.form label{font-size:12px;font-weight:700;color:var(--muted)}
.checks{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.checks label{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;font-weight:600;color:var(--ink2);background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--soft);border-radius:12px;padding:10px;min-height:120px}.col h3{margin:0 0 8px;font-size:12px;font-weight:800;letter-spacing:.5px;color:var(--muted)}
.kc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}.kc b{display:block;font-size:13px;color:var(--figure)}.kc small{color:var(--muted);font-size:11.5px}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.6}
.note{background:var(--tint);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--ink2);line-height:1.5}
.warn{background:var(--mix-bg);border-color:var(--mix-line)}
/* drawer */
.ov{position:fixed;inset:0;background:rgba(8,40,48,.35);z-index:40;display:none}.ov.on{display:block}
.dw{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--paper);z-index:41;box-shadow:-10px 0 30px rgba(0,0,0,.15);transform:translateX(105%);transition:transform .2s ease;display:flex;flex-direction:column}
.dw.on{transform:none}.dw-h{padding:14px 18px;border-bottom:1px solid var(--line);background:#fff;display:flex;gap:10px;align-items:flex-start}
.dw-h h2{margin:0;font-size:19px}.dw-b{padding:14px 18px 40px;overflow-y:auto;flex:1}
.x{margin-left:auto;min-width:40px;min-height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:18px;cursor:pointer}
.tile{padding:10px 12px}.tile .l{font-size:10.5px;font-weight:800;letter-spacing:.5px;color:var(--muted)}.tile .v{font-family:var(--mono);font-size:17px;font-weight:700;color:var(--figure);margin-top:3px}.tile .s{font-size:11.5px;color:var(--muted)}
.fl{border-left:4px solid var(--mix);padding:10px 12px;background:#fff;border-radius:8px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:8px;font-size:13px;line-height:1.5}
.fl.critical{border-left-color:var(--down)}.fl b{color:var(--figure)}.fl .w{color:var(--ink2)}
.rt{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;font-size:13px}
.log{font-size:12.5px;border-top:1px solid var(--soft);padding:7px 0}.log small{color:var(--muted)}
.ans{white-space:pre-wrap;font-size:13.5px;line-height:1.6;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--figure);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:60;display:none}
@media (max-width:760px){
  :root{--px:14px}.desk{display:none}.g4,.g6{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g2{grid-template-columns:minmax(0,1fr)}
  .kpi .n{font-size:21px}.hide-m{display:none}table{font-size:12.5px}th,td{padding:8px 6px}
  .kan{grid-auto-flow:row;grid-auto-columns:auto}.top{gap:8px}
}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <a class="logo" href="index.html">ipo<span>work</span></a><span class="desk" id="deskLabel">PRO</span>
    <span class="sp"></span>
    <select id="deskSwitch" aria-label="Switch desk" style="display:none"><option value="mb">Merchant Banker Desk</option><option value="inst">Institution Desk</option><option value="cacs">CA / CS Desk</option></select>
    <button class="btn o" id="addBtn" type="button">+ Add company by CIN</button>
    <span class="sub" id="who"></span>
  </header>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  <main id="app"><div class="empty">Loading ipowork intelligence…</div></main>
</div>
<div class="ov" id="ov"></div>
<aside class="dw" id="dw" aria-label="Company intelligence" role="dialog"><div class="dw-h" id="dwh"></div><div class="dw-b" id="dwb"></div></aside>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
var P=window.IPWPro, cr=function(x){ return P.crore(x); };
var DESKS={
  mb:{label:'MERCHANT BANKER DESK', rec:'deal', tabs:[['radar','Deal radar'],['screen','Discover'],['pipe','Mandate pipeline'],['watch','Watchlists'],['ask','Ask IPOWORK']],
      stages:['Identified','Contacted','Meeting','Evaluation','Due diligence','Mandate discussion','Mandate won','Execution','Completed'],
      asks:['Which companies are becoming IPO-ready?','Show profitable companies with high growth and low debt.','Which prospects in my pipeline changed materially?','Find companies with PAT above ₹10 cr and AIRA above 70.']},
  inst:{label:'INSTITUTION DESK', rec:'portfolio', tabs:[['radar','Opportunities'],['screen','Screen'],['mandate','Our mandate'],['port','Portfolio'],['watch','Watchlists'],['ask','Ask IPOWORK']],
      stages:['Holding','Watch','Exit planning','Exited'],
      asks:['Show companies matching our mandate.','Find profitable companies that may need growth capital.','Which portfolio companies need attention, and why?','Show high-growth companies with low leverage.']},
  cacs:{label:'CA / CS DESK', rec:'client', tabs:[['dash','My clients'],['radar','IPO & capital radar'],['compare','Compare'],['pipe','Client pipeline'],['screen','Discover'],['ask','Ask IPOWORK']],
      stages:['Identified','Discussing','Evaluation','Capital planning','Engaged','Execution','Completed'],
      asks:['Which of my clients have deteriorating working capital?','Which clients may need equity funding?','Which clients are becoming IPO-ready?','Compare my clients on margins, debt and growth.']}
};
var S={desk:'mb', tab:'radar', profile:null, U:{}, f:{}, sort:{k:'revenue',d:-1}, radarCat:null, cmp:{}, dw:null, portCat:null};
var app=document.getElementById('app');
function esc(s){ return String(s===null||s===undefined?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function toast(t){ var e=document.getElementById('toast'); e.textContent=t; e.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(function(){ e.style.display='none'; },2600); }
function D(){ return DESKS[S.desk]; }
function recKey(cin){ return S.desk+':'+cin; }
function rec(cin){ var it=P.ws.get('rec',recKey(cin)); return it?it.data:null; }
function myRecs(){ return P.ws.all('rec').filter(function(i){ return i.key.indexOf(S.desk+':')===0; }).map(function(i){ return i.data; }).filter(function(r){ return S.U[r.cin]; }); }
function list(){ return Object.keys(S.U).map(function(c){ return S.U[c]; }); }
function pct(v){ return v==null?'—':v+'%'; }
function status(C){ var c=C.cls; return c.attention?'<span class="dot r">Attention</span>':(C.flags.length?'<span class="dot a">Watch</span>':'<span class="dot g">Normal</span>'); }
function routesChips(C){ return '<div class="chips">'+C.routes.map(function(r){ return '<span class="chip '+r.fit+'">'+esc(r.route)+'</span>'; }).join('')+'</div>'; }
function changedList(){ var out=[]; myRecs().forEach(function(r){ var d=P.diff(r.snap,S.U[r.cin]); if(d.length) out.push({C:S.U[r.cin], d:d}); });
  P.ws.all('watch').forEach(function(w){ (w.data.cins||[]).forEach(function(c){ if(!S.U[c]||out.some(function(o){return o.C.cin===c;})) return; var d=P.diff((w.data.snaps||{})[c],S.U[c]); if(d.length) out.push({C:S.U[c],d:d}); }); });
  return out; }

/* ---------- company table ---------- */
var COLS=[['name','Company'],['sector','Sector'],['revenue','Revenue',1],['growth','Growth',1],['pat','PAT',1],['ebitdaM','EBITDA %',1],['roce','ROCE',1],['de','D/E',1],['aira','AIRA',1],['risk','Risk',1],['stage','Stage',1]];
function table(rows, extra){
  if(!rows.length) return '<div class="card empty">No companies here yet.</div>';
  var k=S.sort.k, d=S.sort.d;
  rows=rows.slice().sort(function(a,b){ var x=k==='name'||k==='sector'?(a[k]||'').localeCompare(b[k]||''):((a.m[k]==null?-1e12:a.m[k])-(b.m[k]==null?-1e12:b.m[k])); return x*d; });
  return '<div class="scroll"><table><thead><tr>'+COLS.map(function(c,i){ return '<th data-sort="'+c[0]+'" class="'+(c[2]?'n ':'')+(i>1&&i<9?'':'')+(['sector','ebitdaM','roce','risk'].indexOf(c[0])>-1?'hide-m':'')+'">'+c[1]+(S.sort.k===c[0]?(S.sort.d>0?' ▲':' ▼'):'')+'</th>'; }).join('')+'<th>Status</th>'+(extra?'<th>'+extra.h+'</th>':'<th class="hide-m">Capital routes</th>')+'</tr></thead><tbody>'
    +rows.map(function(C){ var m=C.m; return '<tr class="row" data-cin="'+C.cin+'"><td class="cn"><b>'+esc(C.name)+'</b><small>'+esc(C.cin)+(C.state?' · '+esc(C.state):'')+'</small></td><td class="hide-m">'+esc(C.sector)+'</td><td class="n">'+cr(m.revenue)+'</td><td class="n">'+pct(m.growth)+'</td><td class="n">'+cr(m.pat)+'</td><td class="n hide-m">'+pct(m.ebitdaM)+'</td><td class="n hide-m">'+pct(m.roce)+'</td><td class="n">'+(m.de==null?'—':m.de+'×')+'</td><td class="n">'+(m.aira==null?'—':m.aira)+'</td><td class="n hide-m">'+(m.risk==null?'—':m.risk)+'</td><td class="n">'+(m.stage||'—')+'</td><td>'+status(C)+'</td><td'+(extra?'':' class="hide-m"')+'>'+(extra?extra.f(C):routesChips(C))+'</td></tr>'; }).join('')+'</tbody></table></div>';
}

/* ---------- views ---------- */
var CATS={mb:[['highPotential','High potential','grn'],['ipo','IPO candidates','blu'],['sme','SME IPO','blu'],['mainboard','Mainboard','blu'],['pe','PE / pre-IPO','blu'],['debt','Debt candidates','blu'],['capitalReq','Need capital','amb'],['changed','Recently changed','amb']],
  cacs:[['total','Total clients',''],['healthy','Healthy','grn'],['growth','Growing','grn'],['attention','Attention required','red'],['finWatch','Financial watch','amb'],['compWatch','Compliance watch','amb'],['capitalReq','Capital requirement','blu'],['ipo','IPO potential','blu'],['debt','Debt requirement','blu'],['pe','PE / AIF potential','blu'],['changed','Recently changed','amb']]};
function catFilter(rows, cat){ if(!cat||cat==='total') return rows; if(cat==='changed'){ var ch=changedList().map(function(o){return o.C.cin;}); return rows.filter(function(C){return ch.indexOf(C.cin)>-1;}); } return rows.filter(function(C){ return C.cls[cat]; }); }
function kpis(rows, cats){
  return '<div class="grid g4" style="margin-bottom:14px">'+cats.map(function(c){ var n=catFilter(rows,c[0]).length; return '<button type="button" class="card kpi '+c[2]+(S.radarCat===c[0]?' on':'')+'" data-cat="'+c[0]+'"><div class="n">'+n+'</div><div class="l">'+c[1].toUpperCase()+'</div></button>'; }).join('')+'</div>';
}
function vRadarMB(){
  var rows=list();
  return '<h1>Deal radar</h1><p class="sub">'+rows.length+' companies with ipowork intelligence. Tap a category. Every route shows its reason; signals are intelligence, not guaranteed mandates.</p><div style="height:12px"></div>'
    +kpis(rows, CATS.mb)+table(catFilter(rows,S.radarCat))+changesBlock();
}
function changesBlock(){ var ch=changedList(); if(!ch.length) return ''; return '<h2>Changed since you saved them</h2><div class="grid g2">'+ch.map(function(o){ return '<div class="card" data-cin="'+o.C.cin+'" style="cursor:pointer"><b style="color:var(--figure)">'+esc(o.C.name)+'</b><div class="chips" style="margin-top:6px">'+o.d.map(function(x){ return '<span class="chip '+(x.good===false?'attention':x.good?'strong':'')+'">'+esc(x.t)+'</span>'; }).join('')+'</div></div>'; }).join('')+'</div>'; }
function sectors(){ var s={}; list().forEach(function(C){ if(C.sector) s[C.sector]=1; }); return Object.keys(s).sort(); }
function states(){ var s={}; list().forEach(function(C){ if(C.state) s[C.state]=1; }); return Object.keys(s).sort(); }
function vScreen(){
  var f=S.f, opt=function(arr,v){ return '<option value="">Any</option>'+arr.map(function(x){ return '<option'+(x===v?' selected':'')+'>'+esc(x)+'</option>'; }).join(''); };
  var num=function(id,label,ph){ return '<div><label for="f-'+id+'">'+label+'</label><input id="f-'+id+'" data-f="'+id+'" inputmode="decimal" placeholder="'+(ph||'')+'" value="'+esc(f[id]||'')+'"></div>'; };
  var rows=list().filter(function(C){ var m=C.m, n=function(k){ return f[k]!==undefined&&f[k]!==''?+f[k]:null; };
    if(f.q && (C.name+' '+C.cin).toLowerCase().indexOf(f.q.toLowerCase())<0) return false;
    if(f.sector && C.sector!==f.sector) return false; if(f.state && C.state!==f.state) return false;
    if(n('minRev')!=null && !(m.revenue>=n('minRev'))) return false; if(n('maxRev')!=null && !(m.revenue<=n('maxRev'))) return false;
    if(n('minPat')!=null && !(m.pat>=n('minPat'))) return false; if(n('minGrowth')!=null && !(m.growth>=n('minGrowth'))) return false;
    if(n('minEbitda')!=null && !(m.ebitdaM>=n('minEbitda'))) return false; if(n('minRoce')!=null && !(m.roce>=n('minRoce'))) return false;
    if(n('maxDe')!=null && !(m.de!=null && m.de<=n('maxDe'))) return false; if(n('maxDebtEbitda')!=null && !(m.debtEbitda!=null && m.debtEbitda<=n('maxDebtEbitda'))) return false;
    if(n('minAira')!=null && !(m.aira>=n('minAira'))) return false; if(n('minRisk')!=null && !(m.risk>=n('minRisk'))) return false;
    if(f.stage && String(m.stage)!==f.stage) return false; if(f.route && !C.routes.some(function(r){return r.route===f.route;})) return false;
    return true; });
  return '<h1>'+(S.desk==='inst'?'Screen the universe':'Discover companies')+'</h1><p class="sub">No limits on searches or results. Figures in ₹ crore from filed accounts; stage and routes are ipowork intelligence.</p><div style="height:12px"></div>'
    +'<div class="card"><div class="filters">'
    +'<div style="grid-column:span 2"><label for="f-q">Name or CIN</label><input id="f-q" data-f="q" value="'+esc(f.q||'')+'" placeholder="Search"></div>'

  h+='<h2 style="font-size:15px">Watchlists</h2><div class="checks">'+(wls.length?wls.map(function(w){ return '<label><input type="checkbox" data-wl="'+esc(w.key)+'"'+((w.data.cins||[]).indexOf(cin)>-1?' checked':'')+'> '+esc(w.data.name||w.key)+'</label>'; }).join(''):'<span class="sub">Create a watchlist in the Watchlists tab.</span>')+'</div>';
  h+='</div><div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn o sm" id="dwRefresh" type="button">Refresh data (one MCA call)</button></div>'
    +'<p class="sub" style="margin-top:14px">Built from public filings (MCA via Probe42) as of '+esc(C.asOf?new Date(C.asOf).toLocaleDateString('en-IN'):'—')+'. Intelligence only; not investment, credit or legal advice.</p>';
  document.getElementById('dwb').innerHTML=h;
  document.getElementById('dw').classList.add('on'); document.getElementById('ov').classList.add('on');
}
function closeCo(){ S.dw=null; document.getElementById('dw').classList.remove('on'); document.getElementById('ov').classList.remove('on'); }
async function saveRec(cin, patch){
  var r=Object.assign({desk:S.desk, cin:cin, added:new Date().toISOString(), notes:[], tasks:[], snap:P.snap(S.U[cin])}, rec(cin)||{}, patch);
  try{ await P.ws.put('rec', recKey(cin), r); }catch(e){ toast('Could not save: '+e.message); return; }
  openCo(cin); render(true);
}

/* ---------- render ---------- */
function render(keepScroll){
  document.getElementById('tabs').innerHTML=D().tabs.map(function(t){ return '<button type="button" data-tab="'+t[0]+'" class="'+(S.tab===t[0]?'on':'')+'">'+t[1]+'</button>'; }).join('');
  document.getElementById('deskLabel').textContent=D().label;
  var v={radar:S.desk==='inst'?vRadarInst:S.desk==='cacs'?vRadarCacs:vRadarMB, screen:vScreen, pipe:vPipe, watch:vWatch, mandate:vMandate, port:vPort, dash:vDash, compare:vCompare, ask:vAsk}[S.tab];
  var y=window.scrollY; app.innerHTML=(P.ws.mode!=='secure'?'<div class="note warn" style="margin-bottom:12px">Your workspace is saved on this device only. Once ipowork switches on the secure workspace, it syncs privately across your devices.</div>':'')+(v?v():''); if(keepScroll) window.scrollTo(0,y);
  var top=document.querySelector('.top'); if(top) document.documentElement.style.setProperty('--hdr', top.offsetHeight+'px');
}

/* ---------- events ---------- */
document.addEventListener('click', async function(e){
  var t=e.target;
  var tab=t.closest('[data-tab]'); if(tab){ S.tab=tab.getAttribute('data-tab'); S.radarCat=null; render(); window.scrollTo(0,0); return; }
  var go=t.closest('[data-go]'); if(go){ S.tab=go.getAttribute('data-go'); render(); return; }
  var cat=t.closest('[data-cat]'); if(cat){ var c=cat.getAttribute('data-cat'); S.radarCat=S.radarCat===c?null:c; render(true); return; }
  var th=t.closest('th[data-sort]'); if(th){ var k=th.getAttribute('data-sort'); S.sort=S.sort.k===k?{k:k,d:-S.sort.d}:{k:k,d:(k==='name'||k==='sector')?1:-1}; render(true); return; }
  var q=t.closest('[data-q]'); if(q){ document.getElementById('askQ').value=q.getAttribute('data-q'); return; }
  if(t.id==='dwx'||t.id==='ov'){ closeCo(); return; }
  var row=t.closest('[data-cin]'); if(row && !t.closest('#dw')){ openCo(row.getAttribute('data-cin')); return; }
  if(t.id==='fClear'){ S.f={}; render(true); return; }
  if(t.id==='wlAdd'){ var n=document.getElementById('wlName').value.trim(); if(!n) return; try{ await P.ws.put('watch', n.slice(0,60), {name:n.slice(0,60), cins:[], snaps:{}}); }catch(err){ toast(err.message); } render(); return; }
  var wd=t.closest('[data-wldel]'); if(wd){ if(confirm('Delete this watchlist?')){ await P.ws.del('watch', wd.getAttribute('data-wldel')); render(); } return; }
  if(t.id==='mSave'){ var M={}; document.querySelectorAll('[data-mv]').forEach(function(i){ if(i.value!=='') M[i.getAttribute('data-mv')]=+i.value; });
    ['sectors','states','stages','routes'].forEach(function(n){ M[n]=[].slice.call(document.querySelectorAll('[data-m="'+n+'"]:checked')).map(function(i){ return n==='stages'?+i.value:i.value; }); });
    try{ await P.ws.put('mandate','default',M); toast('Mandate saved'); S.tab='radar'; render(); }catch(err){ toast(err.message); } return; }
  if(t.id==='askGo'){ var qq=document.getElementById('askQ').value.trim(), out=document.getElementById('askOut'); if(!qq) return; t.disabled=true; out.innerHTML='<div class="card empty">Reading the data…</div>';
    try{ var ans=await P.ask(qq, scopeRows(document.getElementById('askScope').value), D().label.toLowerCase()); out.innerHTML='<div class="ans">'+esc(ans)+'</div><p class="sub" style="margin-top:6px">Answered from ipowork company data only. Check figures in each company panel before acting.</p>'; }
    catch(err){ out.innerHTML='<div class="card empty">Couldn\u2019t answer just now ('+esc(err.message)+').</div>'; } t.disabled=false; return; }
  if(t.id==='addBtn'){ var cin=prompt('Company CIN (21 characters):'); if(!cin) return; t.disabled=true; toast('Fetching MCA data…');
    try{ var how=await P.addCin(cin, S.profile&&S.profile.email); await load(); var C=S.U[String(cin).trim().toUpperCase()]; toast(how==='cached'?'Already up to date':'Added'); if(C) openCo(C.cin); }catch(err){ toast(err.message); } t.disabled=false; return; }
  if(t.id==='dwRefresh' && S.dw){ t.disabled=true; toast('Refreshing…'); try{ await P.addCin(S.dw, S.profile&&S.profile.email); await load(); openCo(S.dw); toast('Up to date'); }catch(err){ toast(err.message); } return; }
  if(t.id==='wsAdd' && S.dw){ return saveRec(S.dw,{stage:D().stages[0], role:D().rec}); }
  if(t.id==='wsSave' && S.dw){ var st=document.getElementById('wsStage').value; if(!st){ toast('Choose a stage'); return; }
    return saveRec(S.dw,{stage:st, role:D().rec, contact:{name:document.getElementById('wsCn').value.trim(), email:document.getElementById('wsCe').value.trim(), phone:document.getElementById('wsCp').value.trim()}}); }
  if(t.id==='wsRemove' && S.dw){ if(!confirm('Remove from your '+(S.desk==='inst'?'portfolio':'list')+'?')) return; await P.ws.del('rec', recKey(S.dw)); openCo(S.dw); render(true); return; }
  if(t.id==='wsNoteAdd' && S.dw){ var nt=document.getElementById('wsNote').value.trim(); if(!nt) return; var r1=rec(S.dw); r1.notes=(r1.notes||[]).concat([{at:new Date().toISOString(), text:nt.slice(0,2000)}]); return saveRec(S.dw,{notes:r1.notes}); }
  if(t.id==='wsTaskAdd' && S.dw){ var tt=document.getElementById('wsTask').value.trim(); if(!tt) return; var r2=rec(S.dw); r2.tasks=(r2.tasks||[]).concat([{text:tt.slice(0,300), due:document.getElementById('wsDue').value, done:false}]); return saveRec(S.dw,{tasks:r2.tasks}); }
});
document.addEventListener('change', async function(e){
  var t=e.target;
  if(t.matches('[data-f]')){ S.f[t.getAttribute('data-f')]=t.value; render(true); var el=document.getElementById(t.id); if(el&&t.tagName==='INPUT'){ el.focus(); } return; }
  if(t.matches('[data-cmp]')){ S.cmp[t.getAttribute('data-cmp')]=t.checked; render(true); return; }
  if(t.id==='wsStage' && S.desk==='inst' && S.dw){ return saveRec(S.dw,{stage:t.value}); }
  if(t.matches('[data-task]') && S.dw){ var r=rec(S.dw); r.tasks[+t.getAttribute('data-task')].done=t.checked; return saveRec(S.dw,{tasks:r.tasks}); }
  if(t.matches('[data-wl]') && S.dw){ var it=P.ws.get('watch',t.getAttribute('data-wl')); var w=Object.assign({cins:[],snaps:{}},it.data);
    if(t.checked){ if(w.cins.indexOf(S.dw)<0) w.cins.push(S.dw); w.snaps[S.dw]=P.snap(S.U[S.dw]); } else { w.cins=w.cins.filter(function(c){return c!==S.dw;}); delete w.snaps[S.dw]; }
    try{ await P.ws.put('watch', it.key, w); toast('Watchlist updated'); }catch(err){ toast(err.message); } return; }
});
document.addEventListener('input', function(e){ if(e.target.matches('input[data-f="q"]')){ clearTimeout(S._qt); var el=e.target; S._qt=setTimeout(function(){ S.f.q=el.value; render(true); var n=document.getElementById('f-q'); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } },250); } });
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeCo(); });
document.getElementById('deskSwitch').addEventListener('change', function(){ S.desk=this.value; S.tab=D().tabs[0][0]; S.radarCat=null; render(); });

async function load(){ S.U=await P.load(); }
async function start(profile){
  S.profile=profile||{};
  var role=S.profile.role||'';
  S.desk = role==='merchant_banker'?'mb':(role==='institution'||role==='fund_manager')?'inst':role==='ca_cs'?'cacs':'mb';
  if(role==='admin'){ var sw=document.getElementById('deskSwitch'); sw.style.display=''; var q=new URLSearchParams(location.search).get('desk'); if(DESKS[q]) S.desk=q; sw.value=S.desk; }
  S.tab=D().tabs[0][0];
  document.getElementById('who').textContent=(S.profile.full_name||S.profile.email||'')+(S.profile.org?' · '+S.profile.org:'');
  await P.ws.init(S.profile);
  try{ await load(); }catch(e){ app.innerHTML='<div class="card empty">Couldn\u2019t load company data ('+esc(e.message)+'). Please refresh.</div>'; return; }
  render();
}
var started=false; function go(p){ if(started) return; started=true; start(p); }
document.addEventListener('ipw:unlocked', function(e){ go(e.detail); });
if(window.IPWGate && IPWGate.ok && IPWGate.profile) go(IPWGate.profile);
window.__proStart=go;
})();
</script>
